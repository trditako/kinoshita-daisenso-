name: Validate game JavaScript # Hastur reflection and sharing regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'battle-core.js'
      - 'tests/battle-core.test.js'
      - 'tests/castle-attack.test.js'
      - 'kwl.js'
      - 'service-worker.js'
      - 'supabase/functions/kwl-spectator-battle/**'
      - 'tests/kwl-match-flow.test.js'
      - 'tests/kwl-rehearsal.test.js'
      - 'tests/kwl-server-rehearsal.test.js'
      - 'supabase/migrations/20261122123000_kwl_server_rehearsal_isolation.sql'
      - 'supabase/migrations/20261122130000_kwl_rehearsal_env_secret_auth.sql'
      - 'genesis.js'
      - 'hitman.js'
      - 'tests/genesis-kinoshita.test.js'
      - 'tests/hitman-kinoshita.test.js'
      - 'tests/formation-buff-summary.test.js'
      - 'tests/ice-wyvern.test.js'
      - 'tests/pre-kwl-rebalance.test.js'
      - 'zeus.js'
      - 'hastur.js'
      - 'prism.js'
      - 'tests/prism-adaptation.test.js'
      - 'wamuu.js'
      - 'tests/wamuu-trial.test.js'
      - 'tests/zeus-stage.test.js'
      - 'tests/hastur-stage.test.js'
      - 'tests/ai-roster-sync.test.js'
      - 'scripts/export-character-roster.mjs'
      - 'character-roster.json'
      - 'supabase/functions/kwl-spectator-battle/character-data.json'
      - 'supabase/functions/ai-worker/index.ts'
      - '.github/workflows/sync-character-roster.yml'
      - '.github/workflows/validate-index.yml'
  push:
    branches:
      - main
      - feat/chokinoshita-festival-and-growth-ability
      - feat/hastur-raid-20261114
      - fix/god-effects-world-coordinates-20261114
    paths:
      - 'index.html'
      - 'hitman.js'
      - 'zeus.js'
      - 'hastur.js'
      - 'service-worker.js'
      - 'tests/hitman-kinoshita.test.js'
      - 'tests/formation-buff-summary.test.js'
      - 'tests/zeus-stage.test.js'
      - 'tests/hastur-stage.test.js'
      - 'tests/ai-roster-sync.test.js'
      - 'scripts/export-character-roster.mjs'
      - 'supabase/functions/ai-worker/index.ts'
      - '.github/workflows/sync-character-roster.yml'
      - '.github/workflows/validate-index.yml'
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Type-check KWL Edge Function with Deno
        run: deno check --no-lock supabase/functions/kwl-spectator-battle/index.ts
      - name: Check inline JavaScript syntax in index.html
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.I)
          inline = [(attrs, body) for attrs, body in scripts if not re.search(r'\bsrc\s*=', attrs, re.I) and body.strip()]
          if not inline:
              raise SystemExit('No inline JavaScript blocks found')
          Path('/tmp/inline-js').mkdir(exist_ok=True)
          for i, (_, body) in enumerate(inline):
              Path(f'/tmp/inline-js/script-{i}.js').write_text(body, encoding='utf-8')
          print(f'Checking {len(inline)} inline JavaScript block(s)')
          PY
          for file in /tmp/inline-js/*.js; do
            echo "node --check $file"
            node --check "$file"
          done
      - name: Check Genesis Kinoshita script and regression tests
        run: |
          node --check battle-core.js
          node tests/battle-core.test.js
          node tests/castle-attack.test.js
          node --check kwl.js
          node tests/kwl-rehearsal.test.js
          node tests/kwl-server-rehearsal.test.js
          node tests/kwl-match-flow.test.js
          node --check genesis.js
          node --check hitman.js
          node --check zeus.js
          node --check hastur.js
          node --check prism.js
          node tests/prism-adaptation.test.js
          node --check wamuu.js
          node tests/wamuu-trial.test.js
          node tests/genesis-kinoshita.test.js
          node tests/hitman-kinoshita.test.js
          node tests/formation-buff-summary.test.js
          node tests/ice-wyvern.test.js
          node tests/pre-kwl-rebalance.test.js
          node tests/zeus-stage.test.js
          node tests/hastur-stage.test.js
          node tests/ai-roster-sync.test.js
      - name: Install pinned Playwright for runtime roster verification
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium for runtime roster verification
        run: npx playwright install --with-deps chromium
      - name: Verify final runtime character roster export
        run: node scripts/export-character-roster.mjs
