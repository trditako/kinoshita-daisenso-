name: one-time wave reward patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat: add 波動木下 reward') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          
          old='''{name:"狂乱の木下",cost:2400,hp:4600,atk:760,range:128,spd:.72,interval:1.25,recharge:36.0,icon:"😡",motion:"super",attackType:"area",kb:5,series:"狂乱の木下",rarity:"SSR",specialReward:true,ability:{name:"狂乱の猛攻",desc:"攻撃力が高く、攻撃時30%で敵を後退させる",knockbackChance:.3}}'''
          new=old+''',
{name:"波動木下",cost:1800,hp:4200,atk:420,range:110,spd:.48,interval:1.3,recharge:24,icon:"〰️",motion:"super",attackType:"area",kb:4,series:"波動木下降臨クリア報酬",rarity:"SSR",specialReward:true,eventReward:"波動木下降臨",waveLevel:3,ability:{name:"波動Lv3",desc:"攻撃後に波動Lv3を放つ。波動のダメージは攻撃力と同じ。",wave:true}}'''
          if old not in s: raise SystemExit("card insertion target not found")
          s=s.replace(old,new,1)
          
          old='''const allyTraits={'''
          new='''const allyTraits={'''
          # Add the new ally's attribute without changing existing mappings.
          marker='''  '木下（AI）':'鋼','星読み木下':'光','流星木下':'浮','星王木下':'光','狂乱の木下':'黒','突撃ハーランド木下':'無','異常木下':'赤','吉田':'赤','対無木下':'無','赤狩り木下':'赤','黒追撃木下':'黒','天使迎撃木下':'天使','宇宙観測木下':'宇宙','宇宙突破木下':'宇宙','赤壁木下':'赤','無敵壁木下':'無','黒速攻木下':'黒','天使封殺木下':'天使','宇宙砕き木下':'宇宙','未来探査木下':'宇宙','攻略隊長木下':'宇宙','日本防衛木下':'無','日本制圧木下':'無','未来制圧木下':'宇宙','四属性討伐木下':'赤','銀河攻略木下':'宇宙','最終攻略木下':'無','宇宙決戦木下':'宇宙' '''
          replacement=marker.rstrip()[:-1] + ",'波動木下':'宇宙'};" if marker.rstrip().endswith('}') else marker
          # The source line ends with "};" rather than a standalone "}".
          replacement=marker.replace(",'宇宙決戦木下':'宇宙'};"," ,'宇宙決戦木下':'宇宙','波動木下':'宇宙'};").replace("  ,","  ,")
          if marker not in s: raise SystemExit("trait target not found")
          s=s.replace(marker,replacement,1)
          
          # Give allies a wave attack helper and trigger it once per normal attack.
          marker='''function deploy(i){if(!running||!hasCharacter(i)||!formation.includes(i)||money<cards[i].cost||(rechargeLeft[i]||0)>0)return;'''
          helper='''function allyWaveAttack(u){\n const level=Math.max(1,Number(u.waveLevel||0));\n if(!level)return;\n const waveRange=90*level;\n const targets=enemies.filter(e=>e.x>=u.x&&Math.abs(e.x-u.x)<=waveRange);\n for(const e of targets){const dealt=Math.max(1,Math.round(u.atk));hit(e,dealt,u,null);if(e.hp<=0)removeEnemy(e);}\n const wave=document.createElement('div');wave.className='enemyWaveEffect';wave.style.left=u.x+'px';wave.style.bottom='105px';wave.style.setProperty('--wave-width',Math.min(worldWidth-120,u.x+waveRange)-u.x+'px');effects.appendChild(wave);\n for(let i=0;i<Math.min(8,level);i++){const crest=document.createElement('span');crest.className='waveCrest';crest.style.left=(i/Math.max(1,Math.min(8,level)-1)*Math.min(100,waveRange*.11))+'%';crest.style.animationDelay=(i*18)+'ms';wave.appendChild(crest)}\n setTimeout(()=>wave.remove(),520);\n}\n'''
          if marker not in s: raise SystemExit("deploy target not found")
          s=s.replace(marker,helper+marker,1)
          
          old='''ability:c.ability,motion:c.motion,attackType:c.attackType,kb:c.kb,kbRemaining:c.kb,isEnemy:false,owner:'local',cardIndex:i'''
          new='''ability:c.ability,motion:c.motion,attackType:c.attackType,kb:c.kb,kbRemaining:c.kb,waveLevel:c.waveLevel||0,isEnemy:false,owner:'local',cardIndex:i'''
          if old not in s: raise SystemExit("deploy object target not found")
          s=s.replace(old,new,1)
          
          old='''if(pvpMode&&t.isRemote)pvpSend({type:'hit',targetId:t.id,damage:dealt,attackerIndex:u.cardIndex});if(t.hp<=0)removeEnemy(t)}u.cd=u.interval}}'''
          new='''if(pvpMode&&t.isRemote)pvpSend({type:'hit',targetId:t.id,damage:dealt,attackerIndex:u.cardIndex});if(t.hp<=0)removeEnemy(t)}if(u.waveLevel)allyWaveAttack(u);u.cd=u.interval}}'''
          if old not in s: raise SystemExit("attack loop target not found")
          s=s.replace(old,new,1)
          
          old='''else if(selectedMode==='event'&&s.eventReward){eventClears[s.name]=true;const rewardIndex=s.rewardCharacter?cards.findIndex(c=>c.name===s.rewardCharacter):-1;'''
          new='''else if(selectedMode==='event'&&s.eventReward){eventClears[s.name]=true;const rewardIndex=s.rewardCharacter?cards.findIndex(c=>c.name===s.rewardCharacter):-1;'''
          # Replace only the existing event block's reward resolution by adding the rewardCharacter for this event.
          if old not in s: raise SystemExit("event reward target not found")
          # The event stage currently has no rewardCharacter. Add it directly in the stage definition.
          stage_old='''{name:'波動木下降臨',width:2200,baseHp:150000,xp:2500,eventReward:'プレイヤーXP 2500',enemies:'''
          stage_new='''{name:'波動木下降臨',width:2200,baseHp:150000,xp:2500,eventReward:'波動木下',rewardCharacter:'波動木下',enemies:'''
          if stage_old not in s: raise SystemExit("wave stage target not found")
          s=s.replace(stage_old,stage_new,1)
          
          # Ensure the event reward character is restored on reload after a prior clear.
          marker='''if(ai.eventClears&&ai.eventClears['狂乱の木下降臨']){const idx=cards.findIndex(c=>c.name==='狂乱の木下');if(idx>=0)owned.add(idx);}'''
          replacement=marker+'''\n if(ai.eventClears&&ai.eventClears['波動木下降臨']){const idx=cards.findIndex(c=>c.name==='波動木下');if(idx>=0)owned.add(idx);}'''
          if marker not in s: raise SystemExit("AI event ownership target not found")
          s=s.replace(marker,replacement,1)
          
          p.write_text(s,encoding="utf-8")
          PY
          
          node --check <(sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d') || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add 波動木下 reward"
          git push
