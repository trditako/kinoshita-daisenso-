name: Deploy AI Worker to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare minimal Supabase CLI config
        shell: bash
        run: |
          mkdir -p supabase
          if [ ! -f supabase/config.toml ]; then
            cat > supabase/config.toml <<'EOF'
          project_id = "jhohdvuoyvbzwjumnibc"

          [functions.ai-worker]
          verify_jwt = false
          EOF
          fi

      - name: Deploy only ai-worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
          supabase functions deploy ai-worker --project-ref jhohdvuoyvbzwjumnibc
