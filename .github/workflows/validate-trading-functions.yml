name: Validate trading Edge Functions

on:
  pull_request:
    paths:
      - ".github/workflows/validate-trading-functions.yml"
      - "docs/game-wallet-migration-audit.md"
      - "supabase/functions/player-trading/**"
      - "supabase/functions/game-wallet/**"
      - "supabase/functions/ai-trading/**"
      - "supabase/functions/ai-cron/**"
      - "supabase/migrations/*trade*.sql"
      - "supabase/migrations/*game_wallet*.sql"
      - "trade.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-trading-functions.yml"
      - "docs/game-wallet-migration-audit.md"
      - "supabase/functions/player-trading/**"
      - "supabase/functions/game-wallet/**"
      - "supabase/functions/ai-trading/**"
      - "supabase/functions/ai-cron/**"
      - "supabase/migrations/*trade*.sql"
      - "supabase/migrations/*game_wallet*.sql"
      - "trade.js"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate trading UI JavaScript
        run: node --check trade.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check trading Edge Functions
        run: >-
          deno check
          supabase/functions/player-trading/index.ts
          supabase/functions/game-wallet/index.ts
          supabase/functions/ai-trading/index.ts
          supabase/functions/ai-cron/index.ts
