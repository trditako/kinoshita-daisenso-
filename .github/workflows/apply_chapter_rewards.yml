name: Apply chapter rewards
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply chapter reward implementation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='// CHAPTER_REWARDS_IMPLEMENTED_V1'
          if marker in s:
              print('Already implemented')
              raise SystemExit(0)
          start=s.find('const cards=[')
          if start<0: raise SystemExit('cards array not found')
          end=s.find('\n ];', start)
          if end<0: raise SystemExit('cards array end not found')
          cards='''
{name:"突撃ハーランド木下",cost:777,hp:2500,atk:1500,range:60,spd:2.5,interval:.7,recharge:25.0,icon:"⚽",motion:"super",attackType:"area",kb:2,series:"日本編章クリア報酬",rarity:"SR",chapterReward:1,specialReward:true,ability:{name:"突撃ハーランド",desc:"高い攻撃力と素早い突撃を行う範囲攻撃"}},
{name:"異常木下",cost:3000,hp:15000,atk:3000,range:200,spd:.3,interval:.5,recharge:45.0,icon:"😈",motion:"muscle",attackType:"single",kb:5,series:"日本編章クリア報酬",rarity:"SSR",chapterReward:2,specialReward:true,ability:{name:"異常なる一撃",desc:"高耐久・超長射程の強力な単体攻撃"}},
{name:"吉田",cost:200,hp:6000,atk:1111,range:100,spd:1.2,interval:.65,recharge:3.0,icon:"🧑🏻",motion:"power",attackType:"area",kb:2,series:"日本編章クリア報酬",rarity:"SR",chapterReward:3,specialReward:true,ability:{name:"吉田の猛攻",desc:"短い再生時間で出撃できる範囲攻撃"}},'''
          s=s[:end]+cards+s[end:]
          trait="'狂乱の木下':'黒'"
          pos=s.find(trait)
          if pos<0: raise SystemExit('allyTraits marker not found')
          e=s.find('\n',pos)
          s=s[:e]+",\n  '突撃ハーランド木下':'無','異常木下':'赤','吉田':'赤'"+s[e:]
          owned='ownedFlags[0]=true;'
          pos=s.find(owned)
          if pos<0: raise SystemExit('ownedFlags marker not found')
          e=s.find('\n',pos)
          helper='''
// CHAPTER_REWARDS_IMPLEMENTED_V1
const chapterRewardIds=[20,21,22];
function grantChapterReward(chapterIndex){
 const idx=chapterRewardIds[chapterIndex];
 if(!Number.isInteger(idx)||idx<0||idx>=cards.length)return false;
 const wasOwned=!!ownedFlags[idx];
 ownedFlags[idx]=true;
 if(typeof syncOwnedCount==='function')syncOwnedCount();
 return !wasOwned;
}
for(let ch=0;ch<3;ch++){if((chapterClears[ch]||0)>=48)grantChapterReward(ch);}
'''
          s=s[:e]+helper+s[e:]
          target="chapterClears[selectedChapter-1]=Math.max(chapterClears[selectedChapter-1],selectedStage);"
          pos=s.find(target)
          if pos<0: raise SystemExit('chapter clear target not found')
          e=s.find('\n',pos)
          reward_logic='''
 if(selectedStage===48){
  const rewardIndex=chapterRewardIds[selectedChapter-1];
  if(rewardIndex>=0&&rewardIndex<cards.length){
   const wasOwned=hasCharacter(rewardIndex);
   ownedFlags[rewardIndex]=true;
   syncOwnedCount();
   window.__lastChapterReward={index:rewardIndex,newlyOwned:!wasOwned};
  }
 }
'''
          s=s[:e]+reward_logic+s[e:]
          target2="let rewardText='';const gained=addStageXP();"
          pos=s.find(target2)
          if pos<0: raise SystemExit('rewardText target not found')
          e=pos+len(target2)
          add="""
if(selectedMode==='japan'&&window.__lastChapterReward){const cr=window.__lastChapterReward;const cc=cards[cr.index];rewardText=cr.newlyOwned?'🎁 日本編 第'+selectedChapter+'章 全48ステージクリア報酬：'+cc.name+' を入手しました！':'🎁 日本編 第'+selectedChapter+'章 クリア報酬：'+cc.name+'（入手済み）';window.__lastChapterReward=null;}
"""
          s=s[:e]+add+s[e:]
          p.write_text(s,encoding='utf-8')
          print('Updated index.html')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "木下大戦争：各章クリア報酬を実装"
          git push
